name: Build

on:
  push:
    branches:
      - '**'
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0-rc3" || \
            echo "::warning::build-tools 34.0.0-rc3 not in SDK repo, letting AGP resolve it"

      - name: Download XposedBridge API jar
        run: |
          mkdir -p app/libs freeform-server/libs
          curl -fsSL -o app/libs/XposedBridgeAPI-89.jar \
            "https://raw.githubusercontent.com/924587628/XposedBridgeAPI/master/XposedBridgeAPI-89.jar"
          cp app/libs/XposedBridgeAPI-89.jar freeform-server/libs/

      - name: Make gradlew executable
        run: chmod +x gradlew sidebar/gradlew

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Build root project (app, freeform-server, service)
        run: ./gradlew :app:assembleDebug :freeform-server:assembleDebug

      - name: Build sidebar
        working-directory: sidebar
        run: ./gradlew :app:assembleDebug

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: apks
          path: |
            app/build/outputs/apk/**/*.apk
            freeform-server/build/outputs/apk/**/*.apk
            sidebar/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
